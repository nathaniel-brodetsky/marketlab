[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "marketlab"
version = "0.1.0"
description = "Research on order-book data recorded by marketrec: contract reader, bars, microstructure features"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=2.0",
    "pyarrow>=18",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
marketlab = "marketlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["marketlab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"scripts/mutants.py" = ["E501"]  # each fault is one source line, quoted whole
